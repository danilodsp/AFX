site_name: AFX
site_description: Audio feature extraction for machine learning
site_url: https://danilodsp.github.io/AFX/
repo_url: https://github.com/danilodsp/AFX
edit_uri: ""

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Features: features.md
  - librosa equivalence: librosa.md
  - scikit-learn, PyTorch and batch: integrations.md
  - API: api.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
