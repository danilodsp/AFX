name: Release

# Push a tag vX.Y.Z matching the version in pyproject.toml. Publishing uses
# PyPI trusted publishing: register this repository and workflow as a
# trusted publisher for afx-audio on pypi.org first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full Tests workflow (lint, test matrix, minimum versions, notebooks, docs) on the tagged commit
  checks:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      id-token: write

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Check that the tag matches the package version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        test "v$version" = "$GITHUB_REF_NAME"
    - name: Check that the changelog heading dates the release
      run: |
        version="${GITHUB_REF_NAME#v}"
        if ! grep -Eq "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md; then
          echo "CHANGELOG.md needs a heading '## $version (YYYY-MM-DD)'" >&2
          exit 1
        fi
    - run: pip install build twine
    - run: python -m build
    - run: twine check dist/*
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist
        path: dist/

  # Tests the exact files that will be uploaded, from the sdist tree and not the checkout
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Unpack the sdist
      run: |
        mkdir sdist
        tar xzf dist/*.tar.gz -C sdist --strip-components=1
    - name: Test the sdist install
      run: |
        python -m venv venv-sdist
        sdist=$(ls dist/*.tar.gz)
        venv-sdist/bin/pip install "${sdist}[test]"
        cd sdist
        ../venv-sdist/bin/python -m pytest -q
    # The source package is removed so the tests import the installed wheel
    - name: Test the wheel install
      run: |
        python -m venv venv-wheel
        wheel=$(ls dist/*.whl)
        venv-wheel/bin/pip install "${wheel}[test]"
        cp -r sdist wheel-tests
        rm -rf wheel-tests/afx_audio
        cd wheel-tests
        ../venv-wheel/bin/python -m pytest -q

  publish:
    needs: [checks, build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
