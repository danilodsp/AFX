name: Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install ruff
    - run: ruff check AFX tests examples notebooks/domain_packs.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package with test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Install PyTorch (CPU) for the AFX.torch tests
      if: runner.os == 'Linux'
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install build twine
    - run: python -m build
    - run: twine check dist/*
    - name: Install the wheel in a clean environment and run the CLI
      run: |
        python -m venv /tmp/venv
        /tmp/venv/bin/pip install dist/*.whl
        /tmp/venv/bin/afx --list-features
        /tmp/venv/bin/afx --list-presets
