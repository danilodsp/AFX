name: Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  # release.yml runs this whole workflow on the tag and publishes only if it passes
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - run: pip install ruff mypy numpy scipy
    - run: ruff check .
    - run: mypy afx_audio

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Codecov accepts uploads from main only with a token or an OIDC identity
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package with test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]" pytest-cov

    - name: Install PyTorch (CPU) for the afx_audio.torch tests
      if: runner.os == 'Linux'
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Run tests
      if: ${{ !(runner.os == 'Linux' && matrix.python-version == '3.12') }}
      run: python -m pytest tests/ -v --tb=short

    - name: Run tests with coverage
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      run: python -m pytest tests/ --tb=short --cov=afx_audio --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        files: coverage.xml
        use_oidc: true
        fail_ci_if_error: false

  minimum-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.10"
    - name: Install the oldest supported dependencies
      run: |
        pip install "numpy==1.23.5" "scipy==1.10.1" "soundfile==0.12.1" "scikit-learn==1.3.2" \
          "pandas==1.5.3" "pyarrow==10.0.1" "matplotlib==3.7.0" "librosa==0.10.1" "setuptools<70" pytest
        pip install --no-deps -e .
    - run: python -m pytest tests/ -q

  notebooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install notebook dependencies
      run: |
        pip install -e ".[notebooks,test]"
        pip install torch --index-url https://download.pytorch.org/whl/cpu
    - name: Execute the notebooks
      env:
        AFX_RUN_NOTEBOOKS: "1"
      run: |
        if [ -f tests/test_notebooks.py ]; then
          python -m pytest tests/test_notebooks.py -v --tb=short
        else
          echo "tests/test_notebooks.py not present, nothing to run"
        fi

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - run: pip install -e ".[docs]"
    - run: python docs/gen_features.py --check
    - run: mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - run: pip install build twine
    - run: python -m build
    - run: twine check dist/*
    - name: Install the wheel in a clean environment and run the CLI
      run: |
        python -m venv /tmp/venv
        /tmp/venv/bin/pip install dist/*.whl
        /tmp/venv/bin/afx --list-features
        /tmp/venv/bin/afx --list-presets
        /tmp/venv/bin/python -c "import numpy as np, afx_audio; f = afx_audio.extract_all_features(np.random.default_rng(0).standard_normal(16000), 16000, afx_audio.load_preset('speech')); print(len(afx_audio.flatten_features(f)[1]))"
    # Catches files missing from MANIFEST.in: the suite runs from the unpacked sdist only
    - name: Run the test suite from the sdist
      run: |
        mkdir /tmp/sdist
        tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
        python -m venv /tmp/venv-sdist
        sdist=$(ls dist/*.tar.gz)
        /tmp/venv-sdist/bin/pip install "${sdist}[test]"
        cd /tmp/sdist
        /tmp/venv-sdist/bin/python -m pytest -q
