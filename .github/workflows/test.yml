name: Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install ruff mypy numpy scipy
    - run: ruff check .
    - run: mypy afx_audio

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package with test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Install PyTorch (CPU) for the afx_audio.torch tests
      if: runner.os == 'Linux'
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

  minimum-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install the oldest supported dependencies
      run: |
        pip install "numpy==1.23.5" "scipy==1.10.1" "soundfile==0.12.1" "scikit-learn==1.3.2" \
          "pandas==1.5.3" "pyarrow==10.0.1" "matplotlib==3.7.0" "librosa==0.10.1" "setuptools<70" pytest
        pip install --no-deps -e .
    - run: python -m pytest tests/ -q

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -e ".[docs]"
    - run: python docs/gen_features.py --check
    - run: mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install build twine
    - run: python -m build
    - run: twine check dist/*
    - name: Install the wheel in a clean environment and run the CLI
      run: |
        python -m venv /tmp/venv
        /tmp/venv/bin/pip install dist/*.whl
        /tmp/venv/bin/afx --list-features
        /tmp/venv/bin/afx --list-presets
        /tmp/venv/bin/python -c "import numpy as np, afx_audio; f = afx_audio.extract_all_features(np.random.default_rng(0).standard_normal(16000), 16000, afx_audio.load_preset('speech')); print(len(afx_audio.flatten_features(f)[1]))"
