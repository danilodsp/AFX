name: Paper

# Builds the JOSS draft PDF; download it from the run's artifacts.
on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # openjournals-draft-action runs openjournals/inara:latest, so pinning the
    # action does not pin the build; this runs inara 1.3.1 by digest instead
    - name: Build draft PDF
      run: >-
        docker run --rm -v "$GITHUB_WORKSPACE:/data" -e GIT_SHA="$GITHUB_SHA" -e JOURNAL=joss
        openjournals/inara:1.3.1@sha256:a0414b8b72fd8923917ede614d340d98dc7aa3102aabc2e955e9c02a6100fd62
        -o pdf paper/paper.md
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: paper
        path: paper/paper.pdf
